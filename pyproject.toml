[project]
name = "ai-engineering"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.4.0",
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "openai>=3.44.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
# Con "auto", pytest-asyncio trata cada `async def test_...` como test asíncrono
# sin tener que decorarlo con @pytest.mark.asyncio.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Agrega la raíz al sys.path para que los tests importen llm_client sin
# instalar el proyecto como paquete.
pythonpath = ["."]
